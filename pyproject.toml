[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "flashsolvers-cloudflare"
version = "0.1.0"
description = "Solve the Cloudflare WAF challenge with the Flash Solvers API"
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[project.urls]
Documentation = "https://flashsolvers.com/"
Source = "https://github.com/flash-solvers/cloudflare-sdk-python"

[tool.setuptools]
packages = ["flashsolvers_cloudflare"]
